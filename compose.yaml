services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  telegram-bot:
    build: ./bot
    container_name: tg-bot
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - OLLAMA_URL=http://ollama:11434/api/chat
      - MODEL_NAME=sysadmin
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
